<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="400" fill="#2a2a2a"/>

  <text x="340" y="28" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">DummyBone の効果</text>
  <text x="340" y="48" font-size="11" fill="#888" text-anchor="middle">末端ボーンの物理制御を改善</text>

  <g transform="translate(45, 70)">
    <rect width="280" height="250" fill="#1e1e1e" rx="5"/>
    <text x="140" y="28" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="bold">DummyBone なし</text>
    <text x="140" y="47" font-size="10" fill="#888" text-anchor="middle">DummyBoneLength = 0</text>

    <g transform="translate(140, 78)">
      <circle cx="0" cy="0" r="10" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
      <text x="26" y="4" font-size="9" fill="#fbbf24">Root</text>

      <line x1="0" y1="10" x2="0" y2="42" stroke="#0080ff" stroke-width="4"/>
      <circle cx="0" cy="42" r="6" fill="#0080ff"/>

      <line x1="0" y1="48" x2="0" y2="80" stroke="#0080ff" stroke-width="4"/>
      <circle cx="0" cy="80" r="6" fill="#0080ff"/>

      <line x1="0" y1="86" x2="0" y2="118" stroke="#ff6b6b" stroke-width="4"/>
      <circle cx="0" cy="118" r="6" fill="#ff6b6b"/>
      <text x="24" y="122" font-size="9" fill="#ff6b6b">末端</text>
    </g>

    <text x="140" y="232" font-size="10" fill="#ff6b6b" text-anchor="middle">末端の動きが不安定</text>
  </g>

  <g transform="translate(355, 70)">
    <rect width="280" height="250" fill="#1e1e1e" rx="5"/>
    <text x="140" y="28" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">DummyBone あり</text>
    <text x="140" y="47" font-size="10" fill="#888" text-anchor="middle">DummyBoneLength &gt; 0</text>

    <g transform="translate(140, 68)">
      <circle cx="0" cy="0" r="10" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
      <text x="26" y="4" font-size="9" fill="#fbbf24">Root</text>

      <line x1="0" y1="10" x2="0" y2="38" stroke="#0080ff" stroke-width="4"/>
      <circle cx="0" cy="38" r="6" fill="#0080ff"/>

      <line x1="0" y1="44" x2="0" y2="72" stroke="#0080ff" stroke-width="4"/>
      <circle cx="0" cy="72" r="6" fill="#0080ff"/>

      <line x1="0" y1="78" x2="0" y2="106" stroke="#4ade80" stroke-width="4"/>
      <circle cx="0" cy="106" r="6" fill="#4ade80"/>
      <text x="24" y="110" font-size="9" fill="#4ade80">末端</text>

      <line x1="0" y1="112" x2="0" y2="148" stroke="#c084fc" stroke-width="3" stroke-dasharray="5,4"/>
      <circle cx="0" cy="148" r="5" fill="#c084fc" fill-opacity="0.45" stroke="#c084fc" stroke-width="1"/>
      <text x="24" y="152" font-size="9" fill="#c084fc">Dummy</text>
    </g>

    <text x="140" y="232" font-size="10" fill="#4ade80" text-anchor="middle">末端が安定する</text>
  </g>

  <g transform="translate(175, 350)">
    <circle cx="0" cy="0" r="5" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <text x="14" y="4" font-size="9" fill="#888">Root</text>

    <circle cx="95" cy="0" r="5" fill="#0080ff"/>
    <text x="109" y="4" font-size="9" fill="#888">物理ボーン</text>

    <line x1="220" y1="0" x2="250" y2="0" stroke="#c084fc" stroke-width="3" stroke-dasharray="5,4"/>
    <text x="262" y="4" font-size="9" fill="#888">Dummy</text>
  </g>

  <text x="340" y="382" font-size="10" fill="#888" text-anchor="middle">DummyBoneは見えないボーンを末端に追加し、末端ボーンに『子』を与えて物理計算を安定させます</text>
</svg>
