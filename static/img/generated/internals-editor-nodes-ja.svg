<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title" font-family="system-ui, sans-serif">
  <title id="title">グラフ、プレビュー、デバッグ対象の3つのノードと編集経路</title>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#39756a"/></marker>
    <marker id="data-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#417aa5"/></marker>
    <style>
      .stage{fill:#dcebe7;stroke:#39756a;stroke-width:1.5}
      .data-stage{fill:#d7e6f3;stroke:#417aa5;stroke-width:1.5}
      .heading{font-size:20px;font-weight:650;fill:#244e46}
      .label{font-size:18px;fill:#244e46}
      .data-label{font-size:18px;fill:#305e80}
      .code{font-family:Consolas, monospace}
      .number{font-size:18px;font-weight:650;fill:#f5faf8;text-anchor:middle}
      .flow{fill:none;stroke:#39756a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flow-arrow)}
      .data-flow{fill:none;stroke:#417aa5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#data-arrow)}
    </style>
  </defs>
  <rect width="1200" height="860" rx="24" fill="#f5faf8"/>
  <text x="36" y="58" font-size="30" font-weight="700" fill="#244e46">3つのノードと編集経路</text>
  <text class="label code" x="414" y="110" text-anchor="middle">CopyNodeDataToPreviewNode</text>
  <path class="flow" d="M213 150V126H615V150"/>

  <g id="graph-node">
    <rect class="stage" x="36" y="150" width="354" height="150" rx="12"/>
    <circle cx="62" cy="176" r="14" fill="#39756a"/>
    <text class="number" x="62" y="182">1</text>
    <text class="heading" x="88" y="183">グラフノード</text>
    <text class="label code" x="54" y="224">UAnimGraphNode_KawaiiPhysics</text>
    <text class="label code" x="54" y="253">Node</text>
    <text class="label" x="54" y="282">アセットの編集値</text>
  </g>
  <g id="preview-node">
    <rect class="data-stage" x="450" y="150" width="330" height="150" rx="12"/>
    <circle cx="476" cy="176" r="14" fill="#417aa5"/>
    <text class="number" x="476" y="182">2</text>
    <text class="heading" x="502" y="183">プレビューノード</text>
    <text class="data-label code" x="468" y="224">FAnimNode_KawaiiPhysics</text>
    <text class="data-label" x="468" y="282">Persona の AnimInstance</text>
  </g>
  <g id="debug-node">
    <rect class="data-stage" x="840" y="150" width="324" height="150" rx="12"/>
    <circle cx="866" cy="176" r="14" fill="#417aa5"/>
    <text class="number" x="866" y="182">3</text>
    <text class="heading" x="892" y="184">デバッグ対象ノード</text>
    <text class="data-label code" x="858" y="224">FAnimNode_KawaiiPhysics</text>
    <text class="data-label" x="858" y="282">PIE などの AnimInstance</text>
  </g>

  <text class="data-label" x="650" y="332" text-anchor="middle">ProceduralWind・形状一致</text>
  <text class="data-label code" x="650" y="359" text-anchor="middle">RequestDynamicParams</text>
  <path class="data-flow" d="M390 268H410V375H1002V300"/>

  <path class="flow" d="M100 450V300"/>
  <text class="label" x="116" y="405">Gizmo 編集</text>
  <path class="flow" d="M615 450V418H213V300"/>
  <text class="label" x="450" y="405"><tspan class="code">EnterMode</tspan>：<tspan class="code">*LimitsData / SyncBones</tspan></text>

  <g id="edit-mode">
    <rect class="stage" x="36" y="450" width="354" height="200" rx="12"/>
    <text class="heading code" x="54" y="483">FKawaiiPhysicsEditMode</text>
    <text class="label code" x="54" y="521">GraphNode / RuntimeNode</text>
    <text class="label" x="54" y="557">Gizmo 編集</text>
    <text class="label code" x="54" y="592">OffsetLocation</text>
    <text class="label code" x="54" y="625">OffsetRotation</text>
  </g>
  <path class="flow" d="M390 557H450"/>
  <g id="edit-mode-runtime-reference">
    <rect class="data-stage" x="450" y="450" width="330" height="200" rx="12"/>
    <text class="heading" x="468" y="483">実行中ノードの参照</text>
    <text class="data-label code" x="468" y="521">RuntimeNode</text>
    <text class="data-label code" x="468" y="559">InRuntimeNode</text>
    <text class="data-label" x="468" y="592"><tspan class="code">EnterMode</tspan> の引数</text>
    <text class="data-label code" x="468" y="625">FAnimNode_KawaiiPhysics</text>
  </g>
  <g id="details-tools">
    <rect class="stage" x="840" y="450" width="324" height="140" rx="12"/>
    <text class="heading" x="858" y="483">Details / Wind Scope</text>
    <text class="label code" x="858" y="514">ResolveLiveAnimNode</text>
    <text class="label code" x="858" y="544">GetDebuggedAnimNode</text>
    <text class="data-label code" x="858" y="570">RequestDynamicParams</text>
  </g>
  <path class="flow" d="M1144 450V300"/>
  <path class="data-flow" d="M1100 450V300"/>

  <g id="limits-data-asset">
    <rect class="data-stage" x="840" y="650" width="324" height="150" rx="12"/>
    <text class="heading code" x="858" y="683">LimitsDataAsset</text>
    <text class="data-label" x="858" y="724"><tspan class="code">DataAsset</tspan> 由来</text>
    <text class="data-label" x="858" y="764">コリジョンの保存値</text>
  </g>
  <path class="data-flow" d="M840 680H810V630H780"/>
  <text class="data-label code" x="568" y="688">ApplyLimitsDataAsset</text>
  <path class="flow" d="M213 650V755H840"/>
  <text class="label code" x="450" y="742">UpdateLimit</text>
  <path class="data-flow" d="M1002 800V830H20V600H36"/>
  <text class="data-label code" x="440" y="817">OnLimitsChanged</text>
</svg>
