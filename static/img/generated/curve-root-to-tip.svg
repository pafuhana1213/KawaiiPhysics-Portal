<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="700" height="360" fill="#2a2a2a"/>

  <!-- Title -->
  <text x="350" y="30" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">カーブによる根元→先端の変化</text>
  <text x="350" y="50" font-size="11" fill="#888" text-anchor="middle">ボーンチェーンに沿ってパラメータを滑らかに変化させる</text>

  <defs>
    <linearGradient id="boneGradient" x1="150" y1="0" x2="550" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Bone chain panel -->
  <g transform="translate(30, 70)">
    <rect width="640" height="165" fill="#1e1e1e" rx="5"/>

    <!-- Root label -->
    <text x="58" y="40" font-size="14" fill="#60a5fa" font-weight="bold" text-anchor="middle">根元</text>
    <text x="58" y="59" font-size="10" fill="#888" text-anchor="middle">硬い</text>
    <text x="58" y="73" font-size="10" fill="#888" text-anchor="middle">戻りやすい</text>
    <text x="58" y="87" font-size="10" fill="#888" text-anchor="middle">揺れ小</text>

    <!-- Tip label -->
    <text x="582" y="40" font-size="14" fill="#fbbf24" font-weight="bold" text-anchor="middle">先端</text>
    <text x="582" y="59" font-size="10" fill="#888" text-anchor="middle">柔らかい</text>
    <text x="582" y="73" font-size="10" fill="#888" text-anchor="middle">よく揺れる</text>
    <text x="582" y="87" font-size="10" fill="#888" text-anchor="middle">揺れ大</text>

    <!-- Swing amplitude guides -->
    <ellipse cx="150" cy="84" rx="8" ry="10" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="220" cy="84" rx="10" ry="16" fill="none" stroke="#7bb0d7" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="290" cy="84" rx="12" ry="23" fill="none" stroke="#96b8b0" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="360" cy="84" rx="14" ry="32" fill="none" stroke="#b2bb89" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="430" cy="84" rx="16" ry="43" fill="none" stroke="#d3bd5a" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="500" cy="84" rx="18" ry="56" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.35"/>

    <!-- Bone chain -->
    <path d="M 150 84 L 220 80 L 290 92 L 360 67 L 430 107 L 500 45" fill="none" stroke="url(#boneGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="84" r="8" fill="#60a5fa" stroke="#ffffff" stroke-width="1"/>
    <circle cx="220" cy="80" r="8" fill="#7bb0d7" stroke="#ffffff" stroke-width="1"/>
    <circle cx="290" cy="92" r="8" fill="#96b8b0" stroke="#ffffff" stroke-width="1"/>
    <circle cx="360" cy="67" r="8" fill="#b2bb89" stroke="#ffffff" stroke-width="1"/>
    <circle cx="430" cy="107" r="8" fill="#d3bd5a" stroke="#ffffff" stroke-width="1"/>
    <circle cx="500" cy="45" r="8" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>

    <!-- Direction hint -->
    <line x1="150" y1="135" x2="500" y2="135" stroke="#888" stroke-width="1.5" opacity="0.55"/>
    <polygon points="508,135 497,130 497,140" fill="#888" opacity="0.55"/>
    <text x="325" y="154" font-size="10" fill="#888" text-anchor="middle">Root から Tip へ評価値が 0.0 → 1.0 に進む</text>
  </g>

  <!-- Curve graph panel -->
  <g transform="translate(100, 252)">
    <rect width="500" height="88" fill="#1e1e1e" rx="5"/>
    <text x="250" y="18" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">例: Stiffness カーブ</text>

    <!-- Axes -->
    <g transform="translate(120, 27)">
      <line x1="0" y1="0" x2="0" y2="44" stroke="#888" stroke-width="1"/>
      <line x1="0" y1="44" x2="270" y2="44" stroke="#888" stroke-width="1"/>
      <text x="-40" y="27" font-size="10" fill="#888" text-anchor="middle" transform="rotate(-90 -40 27)">パラメータ値</text>
      <text x="135" y="61" font-size="10" fill="#888" text-anchor="middle">根元 0.0 → 先端 1.0</text>

      <!-- Descending curve -->
      <path d="M 0 8 C 55 10, 85 16, 125 24 S 205 41, 270 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="4" fill="#60a5fa"/>
      <circle cx="270" cy="40" r="4" fill="#fbbf24"/>
    </g>

    <text x="420" y="48" font-size="10" fill="#888" text-anchor="middle">高い値から</text>
    <text x="420" y="62" font-size="10" fill="#888" text-anchor="middle">低い値へ</text>
  </g>
</svg>
