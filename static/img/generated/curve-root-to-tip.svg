<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" class="kp-curve-diagram" role="img" aria-labelledby="curve-root-to-tip-title curve-root-to-tip-desc"><title id="curve-root-to-tip-title">カーブは基準値に掛ける倍率</title><desc id="curve-root-to-tip-desc">横軸は根元0から最長経路の末端1へのボーン長比。縦軸は倍率。基準値にその位置の倍率を掛ける。</desc><style>.kp-curve-diagram text{font: 13px 'Segoe UI','Noto Sans JP',sans-serif;fill:var(--ifm-font-color-base,#334155)}.kp-curve-diagram .heading{font-size: 14px;font-weight:700}.kp-curve-diagram .axis{fill:none;stroke:var(--ifm-color-emphasis-500,#94a3b8);stroke-width:1.5}.kp-curve-diagram .curve{fill:none;stroke:var(--ifm-color-primary,#2563eb);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.kp-curve-diagram .root{fill:#a855f7;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .tip{fill:#14b8a6;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .body{fill:var(--ifm-color-emphasis-200,#e2e8f0);stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2}.kp-curve-diagram .ghost{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2;stroke-dasharray:5 5}.kp-curve-diagram .leader{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:1.5}</style><text x="18" y="28" class="heading">基準値 × その位置の倍率</text><text x="18" y="62">倍率</text><path class="axis" d="M58 90V180H328"/><path class="axis" opacity=".4" stroke-dasharray="3 5" d="M58 90H328"/><text x="46" y="95" text-anchor="end">1.0</text><text x="46" y="185" text-anchor="end">0</text><path class="curve" d="M58 90L328 171"/><circle class="root" cx="58" cy="90" r="5"/><circle class="tip" cx="328" cy="171" r="5"/><text x="58" y="206">根元 0</text><text x="328" y="206" text-anchor="end">先端 1</text><text x="18" y="244">例: 0.5 × 0.1 = 0.05（先端）</text></svg>
