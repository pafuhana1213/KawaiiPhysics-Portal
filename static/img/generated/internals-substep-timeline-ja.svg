<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title" font-family="system-ui, sans-serif">
  <title id="diagram-title">固定サブステップの時間配分</title>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#39756a"/></marker>
    <marker id="data-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#417aa5"/></marker>
    <marker id="accent-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#bd6a4d"/></marker>
    <marker id="muted-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#6b7c78"/></marker>
    <marker id="white-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#f5faf8"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="720" rx="24" fill="#f5faf8"/>
  <text x="36" y="58" font-size="30" font-weight="700" fill="#244e46">固定サブステップの時間配分</text>
  <text x="36" y="96" font-size="22" font-weight="400" fill="#39756a" font-family="Consolas, monospace">SimulateModifyBones</text>
  <text x="774" y="96" font-size="18" font-weight="400" fill="#6b7c78">例：<tspan font-family="Consolas, monospace">MaxSubsteps = 2</tspan></text>
  <rect x="36" y="142" width="1128" height="108" rx="12" fill="#f5faf8" stroke="#6b7c78" stroke-width="1.5"/>
  <circle cx="62" cy="168" r="14" fill="#39756a"/>
  <text x="62" y="174" font-size="18" font-weight="650" fill="#f5faf8" text-anchor="middle">1</text>
  <text x="88" y="175" font-size="20" font-weight="650" fill="#244e46">フレーム1</text>
  <text x="54" y="200" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace">FrameDeltaTime</text>
  <text x="54" y="230" font-size="18" font-weight="400" fill="#244e46"><tspan font-family="Consolas, monospace">0.5 </tspan>×<tspan font-family="Consolas, monospace"> FixedDt</tspan></text>
  <text x="892" y="179" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace">NumSteps = 0</text>
  <rect x="36" y="274" width="1128" height="108" rx="12" fill="#f5faf8" stroke="#6b7c78" stroke-width="1.5"/>
  <circle cx="62" cy="300" r="14" fill="#39756a"/>
  <text x="62" y="306" font-size="18" font-weight="650" fill="#f5faf8" text-anchor="middle">2</text>
  <text x="88" y="307" font-size="20" font-weight="650" fill="#244e46">フレーム2</text>
  <text x="54" y="332" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace">FrameDeltaTime</text>
  <text x="54" y="362" font-size="18" font-weight="400" fill="#244e46"><tspan font-family="Consolas, monospace">1.75 </tspan>×<tspan font-family="Consolas, monospace"> FixedDt</tspan></text>
  <text x="892" y="311" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace">NumSteps = 2</text>
  <rect x="36" y="406" width="1128" height="108" rx="12" fill="#f5faf8" stroke="#6b7c78" stroke-width="1.5"/>
  <circle cx="62" cy="432" r="14" fill="#39756a"/>
  <text x="62" y="438" font-size="18" font-weight="650" fill="#f5faf8" text-anchor="middle">3</text>
  <text x="88" y="439" font-size="20" font-weight="650" fill="#244e46">フレーム3</text>
  <text x="54" y="464" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace">FrameDeltaTime</text>
  <text x="54" y="494" font-size="18" font-weight="400" fill="#244e46"><tspan font-family="Consolas, monospace">1.25 </tspan>×<tspan font-family="Consolas, monospace"> FixedDt</tspan></text>
  <text x="892" y="443" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace">NumSteps = 1</text>
  <rect x="350" y="168" width="100" height="38" rx="6" fill="#d7e6f3" stroke="#417aa5" stroke-width="1.5"/>
  <text x="400" y="194" font-size="18" font-weight="400" fill="#244e46" text-anchor="middle">端数</text>
  <text x="350" y="230" font-size="18" font-weight="400" fill="#244e46"><tspan font-family="Consolas, monospace">SubstepAccumulator = 0.5 </tspan>×<tspan font-family="Consolas, monospace"> FixedDt</tspan></text>
  <text x="892" y="217" font-size="18" font-weight="400" fill="#244e46">積分なし</text>
  <path d="M450 187H840V262H400V300" fill="none" stroke="#417aa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#data-arrow)"/>
  <rect x="350" y="300" width="200" height="38" rx="6" fill="#dcebe7"/>
  <rect x="350" y="300" width="100" height="38" rx="6" fill="#d7e6f3"/>
  <rect x="350" y="300" width="200" height="38" rx="6" fill="none" stroke="#39756a" stroke-width="1.5"/>
  <rect x="550" y="300" width="200" height="38" rx="6" fill="#dcebe7" stroke="#39756a" stroke-width="1.5"/>
  <rect x="750" y="300" width="50" height="38" rx="6" fill="#f5e3db" stroke="#bd6a4d" stroke-width="1.5"/>
  <text x="450" y="326" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">FixedDt</text>
  <text x="650" y="326" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">FixedDt</text>
  <text x="350" y="362" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace">SubstepAccumulator = 0</text>
  <text x="892" y="349" font-size="18" font-weight="400" fill="#bd6a4d">破棄<tspan font-family="Consolas, monospace"> 0.25 </tspan>×<tspan font-family="Consolas, monospace"> FixedDt</tspan></text>
  <path d="M800 319H874" fill="none" stroke="#bd6a4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent-arrow)"/>
  <rect x="350" y="432" width="200" height="38" rx="6" fill="#dcebe7" stroke="#39756a" stroke-width="1.5"/>
  <rect x="550" y="432" width="50" height="38" rx="6" fill="#d7e6f3" stroke="#417aa5" stroke-width="1.5"/>
  <text x="450" y="458" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">FixedDt</text>
  <text x="350" y="494" font-size="18" font-weight="400" fill="#244e46"><tspan font-family="Consolas, monospace">SubstepAccumulator = 0.25 </tspan>×<tspan font-family="Consolas, monospace"> FixedDt</tspan></text>
  <text x="892" y="481" font-size="18" font-weight="400" fill="#244e46">端数の繰り越し</text>
  <rect x="36" y="542" width="1128" height="146" rx="12" fill="#f5faf8" stroke="#417aa5" stroke-width="1.5"/>
  <text x="54" y="575" font-size="20" font-weight="650" fill="#244e46">フレーム2：ポーズ目標の補間</text>
  <text x="940" y="575" font-size="18" font-weight="400" fill="#417aa5" font-family="Consolas, monospace">Lerp / Slerp</text>
  <path d="M350 625H950" fill="none" stroke="#417aa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#data-arrow)"/>
  <circle cx="350" cy="625" r="6" fill="#417aa5"/>
  <circle cx="650" cy="625" r="6" fill="#417aa5"/>
  <circle cx="950" cy="625" r="6" fill="#417aa5"/>
  <text x="350" y="609" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">PrevPoseLocation</text>
  <text x="650" y="609" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">PoseLocation</text>
  <text x="950" y="609" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">CurrentPoseLocation</text>
  <text x="54" y="666" font-size="18" font-weight="400" fill="#417aa5" font-family="Consolas, monospace">SubstepAlpha</text>
  <text x="350" y="666" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">0</text>
  <text x="650" y="666" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">1/2</text>
  <text x="950" y="666" font-size="18" font-weight="400" fill="#244e46" font-family="Consolas, monospace" text-anchor="middle">1</text>
</svg>
