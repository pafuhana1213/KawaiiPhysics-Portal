<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="440" fill="#2a2a2a"/>

  <text x="360" y="28" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">横方向の細分化（Bridge）</text>
  <text x="360" y="48" font-size="11" fill="#888" text-anchor="middle">隣接する列の隙間をコリジョン点で埋めて貫通を防ぐ</text>

  <g transform="translate(40, 70)">
    <rect width="300" height="275" fill="#1e1e1e" rx="5" stroke="#ff6b6b" stroke-width="2"/>
    <text x="150" y="25" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="bold">なし</text>
    <text x="150" y="43" font-size="10" fill="#888" text-anchor="middle">BoneConstraintSubdivisionCount = 0</text>

    <line x1="92" y1="78" x2="92" y2="198" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="208" y1="78" x2="208" y2="198" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <line x1="92" y1="78" x2="208" y2="78" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="92" y1="138" x2="208" y2="138" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="92" y1="198" x2="208" y2="198" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/>

    <circle cx="150" cy="138" r="36" fill="#f472b6" fill-opacity="0.45" stroke="#f472b6" stroke-width="3"/>
    <text x="150" y="143" font-size="10" fill="#ffffff" text-anchor="middle">脚 / ボール</text>
    <path d="M150,86 C133,108 133,172 150,214" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.85"/>
    <path d="M137,202 L150,218 L163,202" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <circle cx="92" cy="78" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="92" cy="138" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="92" cy="198" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="208" cy="78" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="208" cy="138" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="208" cy="198" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>

    <text x="150" y="255" font-size="11" fill="#ff6b6b" text-anchor="middle" font-weight="bold">列の間をすり抜けて貫通</text>
  </g>

  <g transform="translate(380, 70)">
    <rect width="300" height="275" fill="#1e1e1e" rx="5" stroke="#4ade80" stroke-width="2"/>
    <text x="150" y="25" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">あり</text>
    <text x="150" y="43" font-size="10" fill="#888" text-anchor="middle">BoneConstraintSubdivisionCount &gt; 0</text>

    <line x1="92" y1="78" x2="92" y2="198" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="208" y1="78" x2="208" y2="198" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <line x1="92" y1="78" x2="208" y2="78" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="92" y1="138" x2="208" y2="138" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="92" y1="198" x2="208" y2="198" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/>

    <circle cx="121" cy="78" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="121" cy="78" r="5" fill="#22d3ee"/>
    <circle cx="150" cy="78" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="150" cy="78" r="5" fill="#22d3ee"/>
    <circle cx="179" cy="78" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="179" cy="78" r="5" fill="#22d3ee"/>

    <circle cx="121" cy="138" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="121" cy="138" r="5" fill="#22d3ee"/>
    <circle cx="150" cy="138" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="150" cy="138" r="5" fill="#22d3ee"/>
    <circle cx="179" cy="138" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="179" cy="138" r="5" fill="#22d3ee"/>

    <circle cx="121" cy="198" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="121" cy="198" r="5" fill="#22d3ee"/>
    <circle cx="150" cy="198" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="150" cy="198" r="5" fill="#22d3ee"/>
    <circle cx="179" cy="198" r="11" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="179" cy="198" r="5" fill="#22d3ee"/>

    <circle cx="150" cy="112" r="34" fill="#f472b6" fill-opacity="0.45" stroke="#f472b6" stroke-width="3"/>
    <text x="150" y="117" font-size="10" fill="#ffffff" text-anchor="middle">脚 / ボール</text>
    <line x1="150" y1="151" x2="150" y2="138" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <path d="M139,152 L150,138 L161,152" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="92" cy="78" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="92" cy="138" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="92" cy="198" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="208" cy="78" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="208" cy="138" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="208" cy="198" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>

    <text x="150" y="247" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="bold">コリジョン点が隙間を埋めて</text>
    <text x="150" y="261" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="bold">貫通を防ぐ</text>
  </g>

  <text x="360" y="422" font-size="10" fill="#888" text-anchor="middle">BoneSubdivisionCount(縦)と組み合わせると、布面に2Dグリッド状のコリジョン点が並ぶ</text>
</svg>
