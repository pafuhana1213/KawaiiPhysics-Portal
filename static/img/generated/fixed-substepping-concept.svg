<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4ade80"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="740" height="440" fill="#2a2a2a"/>

  <text x="370" y="28" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Fixed Substepping（フレームレート非依存化）</text>
  <text x="370" y="49" font-size="11" fill="#888" text-anchor="middle">実フレーム時間を固定 dt のサブステップに分割して安定化</text>

  <g transform="translate(40, 65)">
    <rect width="660" height="122" fill="#1e1e1e" rx="5" stroke="#60a5fa" stroke-width="2"/>
    <text x="330" y="20" font-size="12" fill="#60a5fa" text-anchor="middle" font-weight="bold">アキュムレータの仕組み</text>

    <g transform="translate(38, 39)">
      <text x="0" y="10" font-size="10" fill="#888">実フレーム時間（DeltaTime）</text>
      <rect x="125" y="0" width="390" height="16" fill="#333" stroke="#555" stroke-width="1" rx="3"/>
      <rect x="125" y="0" width="80" height="16" fill="#0080ff"/>
      <rect x="207" y="0" width="80" height="16" fill="#0080ff"/>
      <rect x="289" y="0" width="80" height="16" fill="#0080ff"/>
      <rect x="371" y="0" width="80" height="16" fill="#0080ff"/>
      <rect x="453" y="0" width="62" height="16" fill="#fb923c"/>
      <line x1="205" y1="-4" x2="205" y2="22" stroke="#2a2a2a" stroke-width="2"/>
      <line x1="287" y1="-4" x2="287" y2="22" stroke="#2a2a2a" stroke-width="2"/>
      <line x1="369" y1="-4" x2="369" y2="22" stroke="#2a2a2a" stroke-width="2"/>
      <line x1="451" y1="-4" x2="451" y2="22" stroke="#2a2a2a" stroke-width="2"/>
      <text x="165" y="37" font-size="9" fill="#60a5fa" text-anchor="middle">FixedDt</text>
      <text x="247" y="37" font-size="9" fill="#60a5fa" text-anchor="middle">FixedDt</text>
      <text x="329" y="37" font-size="9" fill="#60a5fa" text-anchor="middle">FixedDt</text>
      <text x="411" y="37" font-size="9" fill="#60a5fa" text-anchor="middle">FixedDt</text>
      <line x1="484" y1="24" x2="540" y2="24" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>
      <text x="558" y="28" font-size="10" fill="#fb923c">次フレームへ繰り越し</text>
    </g>

    <g transform="translate(68, 93)">
      <text x="0" y="4" font-size="10" fill="#888">実時間を蓄積</text>
      <line x1="78" y1="0" x2="118" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
      <text x="133" y="4" font-size="10" fill="#888">FixedDt ごとに分割</text>
      <line x1="238" y1="0" x2="278" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
      <text x="293" y="4" font-size="10" fill="#888">回数分ソルバ実行</text>
      <line x1="395" y1="0" x2="435" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
      <text x="450" y="4" font-size="10" fill="#888">余りは繰り越し</text>
    </g>
  </g>

  <g transform="translate(40, 203)">
    <rect width="320" height="114" fill="#1e1e1e" rx="5" stroke="#0080ff" stroke-width="1.5"/>
    <text x="160" y="21" font-size="12" fill="#60a5fa" text-anchor="middle" font-weight="bold">60fps</text>
    <text x="160" y="38" font-size="10" fill="#888" text-anchor="middle">DeltaTime ≒ 16.6ms / FixedDt = 16.6ms</text>

    <g transform="translate(32, 54)">
      <circle cx="18" cy="7" r="8" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
      <path d="M18,15 C31,29 43,42 35,58" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <circle cx="35" cy="58" r="4" fill="#fbbf24"/>
      <path d="M26,19 C43,31 53,47 44,64" fill="none" stroke="#0080ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="64" r="4" fill="#0080ff"/>
    </g>

    <g transform="translate(105, 60)">
      <rect x="0" y="0" width="92" height="18" fill="#333" stroke="#555" stroke-width="1" rx="3"/>
      <rect x="0" y="0" width="92" height="18" fill="#0080ff" rx="3"/>
      <text x="46" y="32" font-size="9" fill="#60a5fa" text-anchor="middle">1サブステップ</text>
      <line x1="105" y1="9" x2="145" y2="9" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
      <circle cx="166" cy="9" r="11" fill="#12351f" stroke="#4ade80" stroke-width="2"/>
      <path d="M160,9 L164,14 L173,4" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="166" y="34" font-size="10" fill="#4ade80" text-anchor="middle">見た目（揺れ方）が一致</text>
    </g>
  </g>

  <g transform="translate(380, 203)">
    <rect width="320" height="114" fill="#1e1e1e" rx="5" stroke="#0080ff" stroke-width="1.5"/>
    <text x="160" y="21" font-size="12" fill="#60a5fa" text-anchor="middle" font-weight="bold">30fps</text>
    <text x="160" y="38" font-size="10" fill="#888" text-anchor="middle">DeltaTime ≒ 33.3ms / FixedDt = 16.6ms</text>

    <g transform="translate(32, 54)">
      <circle cx="18" cy="7" r="8" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
      <path d="M18,15 C31,29 43,42 35,58" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <circle cx="35" cy="58" r="4" fill="#fbbf24"/>
      <path d="M26,19 C43,31 53,47 44,64" fill="none" stroke="#0080ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="64" r="4" fill="#0080ff"/>
    </g>

    <g transform="translate(105, 60)">
      <rect x="0" y="0" width="92" height="18" fill="#333" stroke="#555" stroke-width="1" rx="3"/>
      <rect x="0" y="0" width="45" height="18" fill="#0080ff" rx="3"/>
      <rect x="47" y="0" width="45" height="18" fill="#0080ff" rx="3"/>
      <line x1="46" y1="-3" x2="46" y2="21" stroke="#2a2a2a" stroke-width="2"/>
      <text x="46" y="32" font-size="9" fill="#60a5fa" text-anchor="middle">2サブステップ</text>
      <line x1="105" y1="9" x2="145" y2="9" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
      <circle cx="166" cy="9" r="11" fill="#12351f" stroke="#4ade80" stroke-width="2"/>
      <path d="M160,9 L164,14 L173,4" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="166" y="34" font-size="10" fill="#4ade80" text-anchor="middle">見た目（揺れ方）が一致</text>
    </g>
  </g>

  <g transform="translate(40, 327)">
    <rect width="315" height="45" fill="#1e1e1e" rx="5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="14" y="18" font-size="10" fill="#fb923c" font-weight="bold">高fps時</text>
    <text x="72" y="18" font-size="10" fill="#888">DeltaTime &lt; FixedDt → サブステップ0</text>
    <text x="158" y="34" font-size="10" fill="#888" text-anchor="middle">前状態を維持して過剰な積分をしない</text>
  </g>

  <g transform="translate(385, 327)">
    <rect width="315" height="45" fill="#1e1e1e" rx="5" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="14" y="17" font-size="10" fill="#ff6b6b" font-weight="bold">Max Substeps</text>
    <text x="112" y="17" font-size="10" fill="#888">で1フレームの上限を制限</text>
    <text x="158" y="33" font-size="9" fill="#888" text-anchor="middle">低fps/ヒッチ時の暴走を防止、超過分は破棄</text>
  </g>

  <g transform="translate(230, 381)">
    <rect width="280" height="24" fill="#1e1e1e" rx="5" stroke="#c084fc" stroke-width="1.5"/>
    <text x="140" y="16" font-size="10" fill="#888" text-anchor="middle">
      <tspan fill="#c084fc" font-weight="bold">FixedDt</tspan> = 1 / TargetFramerate（既定 60）
    </text>
  </g>

  <g transform="translate(120, 415)">
    <rect x="-20" y="-13" width="540" height="24" fill="#1e1e1e" rx="5"/>
    <rect x="0" y="-5" width="18" height="10" fill="#0080ff" rx="2"/>
    <text x="26" y="4" font-size="9" fill="#888">固定dtサブステップ</text>
    <rect x="134" y="-5" width="18" height="10" fill="#fb923c" rx="2"/>
    <text x="160" y="4" font-size="9" fill="#888">繰り越し/外力時間</text>
    <circle cx="282" cy="0" r="5" fill="#4ade80"/>
    <text x="294" y="4" font-size="9" fill="#888">一致/成功</text>
    <circle cx="382" cy="0" r="5" fill="#ff6b6b"/>
    <text x="394" y="4" font-size="9" fill="#888">上限/破棄</text>
  </g>

  <text x="370" y="435" font-size="10" fill="#888" text-anchor="middle">v1.21.0 でデフォルト有効。OFF にすると従来の単一ステップ積分(legacy)で動作します。</text>
</svg>
