  <text x="540" y="543" font-size="18" font-weight="400" text-anchor="start" style="fill:#305e80" >基底クラス</text>
  <text x="540" y="573" font-size="18" font-weight="400" text-anchor="start" style="fill:#305e80" ><tspan class="code">DeltaTime</tspan> の保存</text>
