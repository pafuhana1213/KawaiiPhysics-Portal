  <circle cx="546" cy="654" r="14" fill="#417aa5"/><text x="546" y="660" class="number">3</text>
  <text x="574" y="661" font-size="18" font-weight="650" class="code" text-anchor="start" style="fill:#305e80" >EvaluateSkeletalControl_AnyThread</text>
