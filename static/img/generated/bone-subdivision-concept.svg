<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#2a2a2a"/>

  <text x="360" y="28" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Bone Subdivision（ボーン細分化）</text>
  <text x="360" y="48" font-size="11" fill="#888" text-anchor="middle">実ボーン間にダミーを挿入してコリジョン解像度を上げ、貫通を防ぐ</text>

  <g transform="translate(40, 67)">
    <rect width="300" height="205" fill="#1e1e1e" rx="5" stroke="#ff6b6b" stroke-width="2"/>
    <text x="150" y="24" font-size="12" fill="#ff6b6b" text-anchor="middle" font-weight="bold">細分化なし（BoneSubdivisionCount = 0）</text>

    <ellipse cx="185" cy="108" rx="37" ry="82" fill="#555" stroke="#666" stroke-width="2"/>
    <text x="185" y="197" font-size="9" fill="#888" text-anchor="middle">脚コリジョン</text>

    <line x1="81" y1="48" x2="210" y2="112" stroke="#0080ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="210" y1="112" x2="112" y2="168" stroke="#0080ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="81" cy="48" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="210" cy="112" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="112" cy="168" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>

    <line x1="184" y1="85" x2="214" y2="115" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
    <line x1="214" y1="85" x2="184" y2="115" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="189" font-size="10" fill="#ff6b6b" text-anchor="middle">ボーン間に判定点が無く脚をすり抜ける</text>
  </g>

  <g transform="translate(380, 67)">
    <rect width="300" height="205" fill="#1e1e1e" rx="5" stroke="#4ade80" stroke-width="2"/>
    <text x="150" y="24" font-size="12" fill="#4ade80" text-anchor="middle" font-weight="bold">細分化あり（BoneSubdivisionCount &gt; 0）</text>

    <ellipse cx="185" cy="108" rx="37" ry="82" fill="#555" stroke="#666" stroke-width="2"/>
    <text x="185" y="197" font-size="9" fill="#888" text-anchor="middle">脚コリジョン</text>

    <path d="M80,48 C112,61 137,76 154,95 S133,145 106,168" fill="none" stroke="#0080ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="48" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="154" cy="95" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="106" cy="168" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="3"/>

    <circle cx="105" cy="59" r="14" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="105" cy="59" r="5" fill="#22d3ee"/>
    <circle cx="128" cy="74" r="14" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="128" cy="74" r="5" fill="#22d3ee"/>
    <circle cx="148" cy="119" r="14" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="148" cy="119" r="5" fill="#22d3ee"/>
    <circle cx="132" cy="147" r="14" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="132" cy="147" r="5" fill="#22d3ee"/>

    <line x1="196" y1="114" x2="156" y2="114" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="219" y="111" font-size="9" fill="#4ade80" text-anchor="middle">押し出し</text>
    <text x="150" y="189" font-size="10" fill="#4ade80" text-anchor="middle">挿入ダミーがコリジョンに参加し貫通を防止</text>
  </g>

  <g transform="translate(95, 288)">
    <rect width="530" height="74" fill="#1e1e1e" rx="5" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="265" y="18" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="bold">横方向（Bridge）細分化: 列と列の隙間も埋める</text>

    <line x1="145" y1="30" x2="145" y2="58" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="245" y1="30" x2="245" y2="58" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="345" y1="30" x2="345" y2="58" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="145" y1="30" x2="245" y2="30" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="245" y1="30" x2="345" y2="30" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="145" y1="58" x2="245" y2="58" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="245" y1="58" x2="345" y2="58" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4"/>

    <circle cx="145" cy="30" r="7" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="145" cy="58" r="7" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="245" cy="30" r="7" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="245" cy="58" r="7" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="345" cy="30" r="7" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="345" cy="58" r="7" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>

    <circle cx="195" cy="30" r="5" fill="#22d3ee"/>
    <circle cx="295" cy="30" r="5" fill="#22d3ee"/>
    <circle cx="195" cy="58" r="5" fill="#22d3ee"/>
    <circle cx="295" cy="58" r="5" fill="#22d3ee"/>
    <text x="405" y="48" font-size="9" fill="#888">2D グリッド状の判定点</text>
  </g>

  <g transform="translate(165, 378)">
    <circle cx="0" cy="0" r="5" fill="#fbbf24"/>
    <text x="12" y="4" font-size="9" fill="#888">実ボーン</text>
    <circle cx="98" cy="0" r="5" fill="#22d3ee"/>
    <text x="110" y="4" font-size="9" fill="#888">ボーン間ダミー</text>
    <circle cx="232" cy="0" r="5" fill="#ff6b6b"/>
    <text x="244" y="4" font-size="9" fill="#888">先端ダミー</text>
    <text x="343" y="4" font-size="9" fill="#888">デバッグ描画の色分けに一致</text>
  </g>

  <text x="360" y="414" font-size="10" fill="#888" text-anchor="middle">ダミーは実スケルトンに存在せず最終出力で除外。挿入数は距離と半径から自動補正されます。</text>
</svg>
