<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" class="kp-curve-diagram" role="img" aria-labelledby="curve-skirt-example-title curve-skirt-example-desc"><title id="curve-skirt-example-title">スカート: 裾ほどボーンの衝突半径を大きくする</title><desc id="curve-skirt-example-desc">腰のRadius倍率1から裾の3へ増える。腰は根元、裾は最長経路の先端。青い円はボーンの衝突半径、オレンジのカプセルは脚のコリジョン。裾ほど脚との衝突範囲を広く取る模式図で、布自体を膨らませる設定ではない。</desc><style>.kp-curve-diagram text{font: 13px 'Segoe UI','Noto Sans JP',sans-serif;fill:var(--ifm-font-color-base,#334155)}.kp-curve-diagram .heading{font-size: 14px;font-weight:700}.kp-curve-diagram .axis{fill:none;stroke:var(--ifm-color-emphasis-500,#94a3b8);stroke-width:1.5}.kp-curve-diagram .curve{fill:none;stroke:var(--ifm-color-primary,#2563eb);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.kp-curve-diagram .root{fill:#a855f7;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .tip{fill:#14b8a6;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .body{fill:var(--ifm-color-emphasis-200,#e2e8f0);stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2}.kp-curve-diagram .ghost{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2;stroke-dasharray:5 5}.kp-curve-diagram .leader{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:1.5}</style><text x="18" y="28" class="heading">スカート / Radius</text><text x="18" y="54">脚との衝突範囲を裾ほど広く取る</text><path class="body" d="M72 75Q88 65 104 75L113 104H63Z"/><g fill="#f59e0b" fill-opacity=".18" stroke="#d97706" stroke-width="2"><rect x="46" y="134" width="24" height="119" rx="12"/><rect x="77" y="134" width="24" height="119" rx="12"/></g><path class="body" fill-opacity=".15" d="M67 104H109Q121 171 157 230Q92 252 32 230Q57 173 67 104Z"/><path class="leader" opacity=".5" d="M71 117L58 226M108 117L126 225"/><path class="curve" d="M89 113L116 174L129 227"/><g fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-width="2"><circle cx="89" cy="113" r="8"/><circle cx="116" cy="174" r="16"/><circle cx="129" cy="227" r="24"/></g><circle class="root" cx="89" cy="113" r="4"/><circle class="tip" cx="129" cy="227" r="4"/><path class="leader" d="M100 113H177M155 227H177"/><text x="185" y="109">腰 / 根元</text><text x="185" y="133">倍率 ×1.0</text><text x="185" y="221">裾 / 先端</text><text x="185" y="245">倍率 ×3.0</text><circle cx="191" cy="161" r="7" fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-width="2"/><text x="208" y="167">衝突半径</text><rect x="184" y="182" width="14" height="18" rx="7" fill="#f59e0b" fill-opacity=".18" stroke="#d97706" stroke-width="2"/><text x="208" y="197">脚コリジョン</text><text x="18" y="276">倍率</text><path class="axis" d="M58 304V394H328"/><path class="axis" opacity=".4" stroke-dasharray="3 5" d="M58 304H328"/><text x="46" y="309" text-anchor="end">3.0</text><text x="46" y="399" text-anchor="end">0</text><path class="curve" d="M58 364L328 304"/><circle class="root" cx="58" cy="364" r="5"/><circle class="tip" cx="328" cy="304" r="5"/><path class="axis" d="M52 364H58"/><text x="46" y="369" text-anchor="end">1.0</text><text x="58" y="420">腰（根元）0</text><text x="328" y="420" text-anchor="end">裾（先端）1</text><text x="18" y="458">円は衝突範囲の模式図</text></svg>
