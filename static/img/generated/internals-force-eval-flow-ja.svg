<text x="54" y="324" font-size="18" font-weight="400" fill="#945139" text-anchor="start" font-family="Consolas, monospace">WorldSpace</text>
<text x="54" y="360" font-size="18" font-weight="400" fill="#945139" text-anchor="start">かつ <tspan font-family="Consolas, monospace">TeleportPhysics</tspan></text>
