<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" class="kp-curve-diagram" role="img" aria-labelledby="curve-hair-example-en-title curve-hair-example-en-desc"><title id="curve-hair-example-en-title">Hair: Reduce the Return Force Toward the Tip</title><desc id="curve-hair-example-en-desc">Hair Stiffness multiplier is 1.0 near the root and 0.1 at the tip. The dashed line and hollow tip show the input pose; the solid line schematically shows the displaced shape. The return force toward the input-pose shape is stronger near the root and weaker toward the tip. The RootBone itself follows the input pose.</desc><style>.kp-curve-diagram text{font: 13px 'Segoe UI','Arial',sans-serif;fill:var(--ifm-font-color-base,#334155)}.kp-curve-diagram .heading{font-size: 14px;font-weight:700}.kp-curve-diagram .axis{fill:none;stroke:var(--ifm-color-emphasis-500,#94a3b8);stroke-width:1.5}.kp-curve-diagram .curve{fill:none;stroke:var(--ifm-color-primary,#2563eb);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.kp-curve-diagram .root{fill:#a855f7;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .tip{fill:#14b8a6;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .body{fill:var(--ifm-color-emphasis-200,#e2e8f0);stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2}.kp-curve-diagram .ghost{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2;stroke-dasharray:5 5}.kp-curve-diagram .leader{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:1.5}</style><text x="18" y="28" class="heading">Hair / Stiffness</text><text x="18" y="54">Reduce the return force toward the tip</text><path class="body" d="M35 236Q45 202 91 202Q121 207 133 236Z"/><ellipse class="body" cx="83" cy="126" rx="38" ry="43"/><path fill="#fbbf24" fill-opacity=".35" stroke="#d97706" stroke-width="2" d="M46 130Q31 80 80 77Q128 75 134 119L113 124Q112 93 86 95Q56 97 46 130Z"/><path class="ghost" d="M112 109Q127 147 122 186Q119 219 120 238"/><path fill="#fbbf24" fill-opacity=".3" stroke="#d97706" stroke-width="3" stroke-linejoin="round" d="M109 103Q130 134 130 163Q136 204 164 230Q142 239 132 224Q111 195 116 163Q120 131 103 111Z"/><circle cx="120" cy="238" r="5" fill="white" stroke="var(--ifm-color-emphasis-600,#64748b)" stroke-width="2"/><circle class="root" cx="112" cy="109" r="6"/><circle class="tip" cx="152" cy="231" r="6"/><path class="leader" d="M121 109H188M160 231H188"/><text x="197" y="103">Near root</text><text x="197" y="127">Multiplier ×1.0</text><text x="197" y="151">Return force: High</text><text x="197" y="220">Tip</text><text x="197" y="244">Multiplier ×0.1</text><text x="197" y="268">Return force: Low</text><path class="ghost" d="M192 183H217"/><text x="227" y="188">Input pose</text><text x="18" y="276">Multiplier</text><path class="axis" d="M58 304V394H328"/><path class="axis" opacity=".4" stroke-dasharray="3 5" d="M58 304H328"/><text x="46" y="309" text-anchor="end">1.0</text><text x="46" y="399" text-anchor="end">0</text><path class="curve" d="M58 304L328 385"/><circle class="root" cx="58" cy="304" r="5"/><circle class="tip" cx="328" cy="385" r="5"/><text x="58" y="420">Root 0</text><text x="328" y="420" text-anchor="end">Tip 1</text><text x="18" y="458">Schematic of shape and return force</text></svg>
