<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#2a2a2a"/>

  <text x="380" y="30" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">パラメータカテゴリ全体像</text>
  <text x="380" y="50" font-size="11" fill="#888" text-anchor="middle">KawaiiPhysics ノードの主要パラメータを4カテゴリで整理</text>

  <g opacity="0.95">
    <line x1="350" y1="210" x2="310" y2="138" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="410" y1="210" x2="450" y2="138" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
    <line x1="350" y1="248" x2="310" y2="300" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <line x1="410" y1="248" x2="450" y2="300" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  </g>

  <g transform="translate(40, 75)">
    <rect width="270" height="125" fill="#1e1e1e" stroke="#60a5fa" stroke-width="2" rx="5"/>
    <text x="135" y="24" font-size="13" fill="#60a5fa" text-anchor="middle" font-weight="bold">Physics</text>
    <text x="22" y="48" font-size="10" fill="#888">• Damping</text>
    <text x="22" y="65" font-size="10" fill="#888">• Stiffness</text>
    <text x="22" y="82" font-size="10" fill="#888">• Radius</text>
    <text x="22" y="99" font-size="10" fill="#888">• WorldDampingLocation</text>
    <text x="22" y="116" font-size="10" fill="#888">• SimulationSpace</text>
  </g>

  <g transform="translate(450, 75)">
    <rect width="270" height="125" fill="#1e1e1e" stroke="#4ade80" stroke-width="2" rx="5"/>
    <text x="135" y="24" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">Collision</text>
    <text x="22" y="50" font-size="10" fill="#888">• Spherical Limit</text>
    <text x="22" y="68" font-size="10" fill="#888">• Capsule Limit</text>
    <text x="22" y="86" font-size="10" fill="#888">• Box / Planar Limit</text>
    <text x="22" y="104" font-size="10" fill="#888">• Shared Collision</text>
  </g>

  <g transform="translate(315, 170)">
    <rect width="130" height="105" fill="#1e1e1e" stroke="#555" stroke-width="1.5" rx="5"/>
    <text x="65" y="22" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">KawaiiPhysics</text>
    <text x="65" y="37" font-size="10" fill="#888" text-anchor="middle">ノード</text>

    <line x1="30" y1="58" x2="55" y2="70" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="70" x2="80" y2="60" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="60" x2="103" y2="78" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="58" r="9" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="55" cy="70" r="6" fill="#0080ff"/>
    <circle cx="80" cy="60" r="6" fill="#0080ff"/>
    <circle cx="103" cy="78" r="6" fill="#0080ff"/>
    <text x="30" y="91" font-size="8" fill="#fbbf24" text-anchor="middle">Root</text>
  </g>

  <g transform="translate(40, 245)">
    <rect width="270" height="115" fill="#1e1e1e" stroke="#c084fc" stroke-width="2" rx="5"/>
    <text x="135" y="24" font-size="13" fill="#c084fc" text-anchor="middle" font-weight="bold">Limits</text>
    <text x="22" y="50" font-size="10" fill="#888">• LimitAngle</text>
    <text x="22" y="68" font-size="10" fill="#888">• PlanarConstraint</text>
    <text x="22" y="86" font-size="10" fill="#888">• BoneConstraint</text>
    <text x="22" y="104" font-size="10" fill="#888">• Compliance</text>
  </g>

  <g transform="translate(450, 245)">
    <rect width="270" height="115" fill="#1e1e1e" stroke="#fb923c" stroke-width="2" rx="5"/>
    <text x="135" y="24" font-size="13" fill="#fb923c" text-anchor="middle" font-weight="bold">External Forces</text>
    <text x="22" y="52" font-size="10" fill="#888">• Gravity</text>
    <text x="22" y="72" font-size="10" fill="#888">• Wind</text>
    <text x="22" y="92" font-size="10" fill="#888">• ExternalForce プリセット</text>
  </g>

  <g transform="translate(84, 388)">
    <circle cx="0" cy="0" r="6" fill="#4a3c00" stroke="#fbbf24" stroke-width="2"/>
    <text x="12" y="4" font-size="10" fill="#888">Root / 実ボーン</text>

    <circle cx="120" cy="0" r="5" fill="#0080ff"/>
    <text x="132" y="4" font-size="10" fill="#888">物理ボーン</text>

    <rect x="220" y="-7" width="16" height="14" fill="#1e1e1e" stroke="#60a5fa" stroke-width="2" rx="3"/>
    <text x="244" y="4" font-size="10" fill="#888">Physics</text>

    <rect x="330" y="-7" width="16" height="14" fill="#1e1e1e" stroke="#4ade80" stroke-width="2" rx="3"/>
    <text x="354" y="4" font-size="10" fill="#888">Collision</text>

    <rect x="450" y="-7" width="16" height="14" fill="#1e1e1e" stroke="#c084fc" stroke-width="2" rx="3"/>
    <text x="474" y="4" font-size="10" fill="#888">Limits</text>

    <line x1="550" y1="0" x2="580" y2="0" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="590" y="4" font-size="10" fill="#888">外力</text>
  </g>

  <text x="380" y="425" font-size="10" fill="#888" text-anchor="middle">詳細は各カテゴリの個別ページを参照。パラメータは Data Asset に保存して再利用できます。</text>
</svg>
