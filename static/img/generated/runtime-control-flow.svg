<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="460" fill="#2a2a2a"/>

  <text x="380" y="32" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">ランタイム制御の流れ</text>
  <text x="380" y="51" text-anchor="middle" fill="#888" font-size="11">UKawaiiPhysicsLibrary — すべて BlueprintThreadSafe</text>

  <!-- Left start flow -->
  <rect x="40" y="96" width="230" height="62" rx="5" fill="#1e1e1e" stroke="#555"/>
  <text x="155" y="132" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">AnimGraph の KawaiiPhysics ノード</text>

  <line x1="155" y1="158" x2="155" y2="188" stroke="#888" stroke-width="2"/>
  <polygon points="155,198 149,186 161,186" fill="#888"/>

  <rect x="40" y="198" width="230" height="74" rx="5" fill="#1e1e1e" stroke="#555"/>
  <text x="155" y="226" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Convert to Kawaii Physics</text>
  <text x="155" y="249" text-anchor="middle" fill="#888" font-size="11" font-family="monospace">FAnimNodeReference → FKawaiiPhysicsReference</text>

  <!-- Branch lines -->
  <circle cx="155" cy="305" r="4" fill="#fbbf24"/>
  <line x1="155" y1="272" x2="155" y2="305" stroke="#888" stroke-width="2"/>
  <polygon points="155,315 149,303 161,303" fill="#888"/>

  <path d="M155 305 H320 V108 H346" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <polygon points="356,108 344,102 344,114" fill="#60a5fa"/>
  <path d="M155 305 H320 V195 H346" fill="none" stroke="#4ade80" stroke-width="2"/>
  <polygon points="356,195 344,189 344,201" fill="#4ade80"/>
  <path d="M155 305 H320 V282 H346" fill="none" stroke="#f472b6" stroke-width="2"/>
  <polygon points="356,282 344,276 344,288" fill="#f472b6"/>
  <path d="M155 305 H320 V369 H346" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="356,369 344,363 344,375" fill="#fbbf24"/>

  <!-- Cards -->
  <rect x="356" y="78" width="348" height="70" rx="5" fill="#1e1e1e" stroke="#555"/>
  <rect x="356" y="78" width="6" height="70" rx="3" fill="#60a5fa"/>
  <text x="376" y="102" fill="#60a5fa" font-size="13" font-weight="bold">パラメータ変更</text>
  <text x="376" y="123" fill="#ffffff" font-size="12" font-family="monospace">SetGravity / SetWindScale / SetPhysicsSettings</text>
  <text x="376" y="140" fill="#888" font-size="11">戻り値をチェーン可能</text>

  <rect x="356" y="165" width="348" height="70" rx="5" fill="#1e1e1e" stroke="#555"/>
  <rect x="356" y="165" width="6" height="70" rx="3" fill="#4ade80"/>
  <text x="376" y="189" fill="#4ade80" font-size="13" font-weight="bold">有効 / 無効</text>
  <text x="376" y="210" fill="#ffffff" font-size="12" font-family="monospace">SetAlphaToComponent</text>
  <text x="376" y="227" fill="#888" font-size="11">0.0 = OFF / 1.0 = ON、または CVar .Enable</text>

  <rect x="356" y="252" width="348" height="70" rx="5" fill="#1e1e1e" stroke="#555"/>
  <rect x="356" y="252" width="6" height="70" rx="3" fill="#f472b6"/>
  <text x="376" y="276" fill="#f472b6" font-size="13" font-weight="bold">外力の適用</text>
  <text x="376" y="297" fill="#ffffff" font-size="12" font-family="monospace">AddExternalForce / AddExternalForcesToComponent</text>
  <text x="376" y="314" fill="#888" font-size="11">FInstancedStruct、bIsOneShot で単発</text>

  <rect x="356" y="339" width="348" height="70" rx="5" fill="#1e1e1e" stroke="#555"/>
  <rect x="356" y="339" width="6" height="70" rx="3" fill="#fbbf24"/>
  <text x="376" y="363" fill="#fbbf24" font-size="13" font-weight="bold">リセット</text>
  <text x="376" y="384" fill="#ffffff" font-size="12" font-family="monospace">ResetDynamics</text>
  <text x="376" y="401" fill="#888" font-size="11">テレポート・リスポーン時</text>

  <!-- Note -->
  <rect x="40" y="421" width="664" height="27" rx="5" fill="#1e1e1e" stroke="#555"/>
  <text x="372" y="439" text-anchor="middle" fill="#ffffff" font-size="11">ノード参照(FKawaiiPhysicsReference)を取得 → 各関数を呼ぶ。Anim Node Function 内やゲームスレッドから安全に呼べる</text>
</svg>
