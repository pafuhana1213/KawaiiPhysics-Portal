<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img"><title>通常のCapsuleは端半径が同じ、Tapered Capsuleは端半径が異なり、Lengthは端球中心間の距離</title><g font-family="system-ui, sans-serif" fill="#39756a"><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="35" y="38" font-size="18" font-weight="700">Capsule</text><path d="M125 86 V308" stroke="#39756a" stroke-dasharray="5 4"/><circle cx="125" cy="130" r="38" fill="#d7e6f3" fill-opacity=".6" stroke="#417aa5" stroke-width="3"/><circle cx="125" cy="130" r="4" fill="#bd6a4d"/><circle cx="125" cy="270" r="38" fill="#d7e6f3" fill-opacity=".6" stroke="#417aa5" stroke-width="3"/><circle cx="125" cy="270" r="4" fill="#bd6a4d"/><path d="M87.0 130.0 L87.0 270.0" stroke="#417aa5" stroke-width="3"/><path d="M163.0 130.0 L163.0 270.0" stroke="#417aa5" stroke-width="3"/><path d="M125 130 h38 M125 270 h38" stroke="#bd6a4d" stroke-width="2"/><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="45" y="77" font-size="17">+Z / Radius0</text><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="45" y="338" font-size="17">−Z / Radius1</text><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="275" y="38" font-size="18" font-weight="700">Tapered Capsule</text><path d="M365 86 V308" stroke="#39756a" stroke-dasharray="5 4"/><circle cx="365" cy="130" r="48" fill="#d7e6f3" fill-opacity=".6" stroke="#417aa5" stroke-width="3"/><circle cx="365" cy="130" r="4" fill="#bd6a4d"/><circle cx="365" cy="270" r="26" fill="#d7e6f3" fill-opacity=".6" stroke="#417aa5" stroke-width="3"/><circle cx="365" cy="270" r="4" fill="#bd6a4d"/><path d="M317.5963576702966 137.54285714285714 L339.32302707141065 274.0857142857143" stroke="#417aa5" stroke-width="3"/><path d="M412.4036423297034 137.54285714285714 L390.67697292858935 274.0857142857143" stroke="#417aa5" stroke-width="3"/><path d="M365 130 h48 M365 270 h26" stroke="#bd6a4d" stroke-width="2"/><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="285" y="77" font-size="17">+Z / Radius0</text><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="285" y="338" font-size="17">−Z / Radius1</text><path d="M246 130 V270 M240 130 h12 M240 270 h12" stroke="#39756a" stroke-width="2"/><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="209" y="207" font-size="15">Length</text><text paint-order="stroke" stroke="#f5faf8" stroke-width="2.2" stroke-linejoin="round" x="25" y="378" font-size="17">Length：端球中心間。全長ではない</text></g></svg>