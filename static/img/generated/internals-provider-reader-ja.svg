<text x="882" y="566" font-size="18" fill="#bd6a4d">当たり判定：空</text>
<text x="882" y="600" font-size="18" fill="#bd6a4d">風：0・外挿停止</text>
<text x="882" y="638" font-size="18" fill="#bd6a4d"><tspan font-family="Consolas, monospace">Publish</tspan>・heartbeat 継続</text>
