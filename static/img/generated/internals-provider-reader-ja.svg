<text x="250" y="166" font-size="20" fill="#244e46" font-weight="650">当たり判定</text>
<text x="716" y="166" font-size="20" fill="#244e46" font-weight="650">風</text>
<text x="54" y="217" font-size="20" fill="#244e46" font-family="Consolas, monospace">Local</text>
<text x="250" y="217" font-size="18" fill="#244e46"><tspan font-family="Consolas, monospace">Local</tspan>：自身で収集</text>
<text x="716" y="217" font-size="18" fill="#244e46"><tspan font-family="Consolas, monospace">Local</tspan>：自身で計算</text>
<text x="54" y="267" font-size="20" fill="#244e46" font-family="Consolas, monospace">Shared</text>
<text x="250" y="267" font-size="18" fill="#244e46">Reader：不在時は空・再試行</text>
<text x="716" y="267" font-size="18" fill="#244e46">共有：不在時は <tspan font-family="Consolas, monospace">Local</tspan></text>
<text x="54" y="324" font-size="20" fill="#244e46" font-family="Consolas, monospace">Auto</text>
<text x="250" y="324" font-size="18" fill="#244e46">生存：Reader / 不在：<tspan font-family="Consolas, monospace">Local</tspan></text>
<text x="716" y="324" font-size="18" fill="#244e46">共有：不在時は <tspan font-family="Consolas, monospace">Local</tspan></text>
<text x="36" y="379" font-size="18" fill="#bd6a4d"><tspan font-family="Consolas, monospace">Shared</tspan> / <tspan font-family="Consolas, monospace">Auto</tspan>・Tag 無効 → <tspan font-family="Consolas, monospace">Local</tspan></text>
<text x="36" y="423" font-size="20" fill="#244e46" font-weight="650"><tspan font-family="Consolas, monospace">Auto</tspan>：provider の状態</text>
<text x="630" y="423" font-size="18" fill="#6b7c78">再確認：<tspan font-family="Consolas, monospace">AutoResolveInterval</tspan></text>
<rect id="local" x="36" y="488" width="300" height="178" rx="12" fill="#dcebe7" stroke="#39756a" stroke-width="1.5"/>
<circle cx="62" cy="514" r="14" fill="#39756a"/>
<text x="62" y="520" font-size="18" fill="#f5faf8" font-weight="650" text-anchor="middle">1</text>
<text x="88" y="524" font-size="20" fill="#244e46" font-weight="650"><tspan font-family="Consolas, monospace">Local</tspan></text>
<text x="54" y="566" font-size="18" fill="#244e46">当たり判定：収集</text>
<text x="54" y="600" font-size="18" fill="#244e46">風：ローカル積算</text>
<rect id="shared" x="450" y="488" width="300" height="178" rx="12" fill="#d7e6f3" stroke="#417aa5" stroke-width="1.5"/>
