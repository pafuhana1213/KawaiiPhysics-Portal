<text x="408" y="708" font-size="18" fill="#bd6a4d">不在・期限切れ</text>
<rect id="missing" x="36" y="754" width="720" height="100" rx="12" fill="#f5faf8" stroke="#6b7c78" stroke-width="1.5"/>
<text x="54" y="790" font-size="20" fill="#244e46" font-weight="650"><tspan font-family="Consolas, monospace">Shared</tspan>・provider 不在</text>
<text x="54" y="817" font-size="18" fill="#244e46">当たり判定：空・再試行</text>
<text x="394" y="817" font-size="18" fill="#244e46">風：ローカル積算</text>
<rect id="restore" x="780" y="754" width="384" height="100" rx="12" fill="#d7e6f3" stroke="#417aa5" stroke-width="1.5"/>
