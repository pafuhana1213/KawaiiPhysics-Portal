<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="diagram-title" font-family="system-ui, sans-serif">
<title id="diagram-title">Local / Shared / Auto の解決</title>
<defs><marker id="green-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#39756a"/></marker><marker id="orange-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#bd6a4d"/></marker></defs>
<rect width="1200" height="890" rx="24" fill="#f5faf8"/>
<text x="36" y="58" font-size="30" fill="#244e46" font-weight="700"><tspan font-family="Consolas, monospace">Local</tspan> / <tspan font-family="Consolas, monospace">Shared</tspan> / <tspan font-family="Consolas, monospace">Auto</tspan> の解決</text>
<text x="36" y="96" font-size="22" fill="#39756a" font-family="Consolas, monospace">SimpleWorldCollisionSource / WindSource</text>
<rect id="table" x="36" y="132" width="1128" height="214" rx="12" fill="#f5faf8" stroke="#6b7c78" stroke-width="1.5"/>
