<text x="348" y="551" font-size="18" fill="#39756a">生存</text>
<path d="M750 576H864" fill="none" stroke="#bd6a4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange-arrow)"/>
<text x="762" y="535" font-size="18" fill="#bd6a4d" font-family="Consolas, monospace">bEnabled</text>
<text x="762" y="559" font-size="18" fill="#bd6a4d" font-family="Consolas, monospace">false</text>
<path d="M1014 488V456H600V488" fill="none" stroke="#39756a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<text x="766" y="446" font-size="18" fill="#39756a" font-family="Consolas, monospace">bEnabled=true</text>
<path d="M600 666V718H186V666" fill="none" stroke="#bd6a4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange-arrow)"/>
