<text x="642" y="665" font-size="18" fill="#39756a" font-family="Consolas, monospace">FAnimNode_KawaiiPhysics</text>
<text x="642" y="697" font-size="18" fill="#244e46">Serial → 形状コピー → 空間変換</text>
<path d="M894 554V594" fill="none" stroke="#39756a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<text x="36" y="755" font-size="18" fill="#6b7c78">キー：ファミリー root Actor・Tag　　レジストリ：経路ごとに独立</text>
