<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" class="kp-curve-diagram" role="img" aria-labelledby="curve-editor-mock-title curve-editor-mock-desc">
  <title id="curve-editor-mock-title">Example Stiffness curve</title><desc id="curve-editor-mock-desc">The X axis is the bone-length ratio and the Y axis is the multiplier. Keys: root (0, 1.0), tip (1, 0.1). This is a diagram, not an actual Unreal Engine screen.</desc>
  <style>
    .kp-curve-diagram { --ink: #334155; --grid: #cbd5e1; --curve: #2563eb; }
    @media (prefers-color-scheme: dark) { .kp-curve-diagram { --ink: #e2e8f0; --grid: #64748b; --curve: #60a5fa; } }
    .kp-curve-diagram text { font: 16px 'Segoe UI', Arial, sans-serif; fill: var(--ifm-font-color-base, var(--ink)); }
    .kp-curve-diagram .heading { font-size: 18px; font-weight: 700; }
    .kp-curve-diagram .axis { fill: none; stroke: var(--ifm-color-emphasis-500, var(--grid)); stroke-width: 1.5; }
    .kp-curve-diagram .curve { fill: none; stroke: var(--ifm-color-primary, var(--curve)); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .kp-curve-diagram .key { fill: var(--ifm-color-primary, var(--curve)); }
  </style>
<text x="18" y="28" class="heading">Stiffness Curve</text><text x="18" y="57" >Keys: (0, 1.0) → (1, 0.1)</text><text x="18" y="86" >Multiplier</text>
  <path class="axis" d="M 58 97 V 198 H 335"/>
  <path class="axis" stroke-dasharray="3 5" opacity="0.45" d="M 58 102 H 330"/>
  <text x="44" y="107" text-anchor="end">1.0</text><text x="44" y="203" text-anchor="end">0</text>
  <path class="curve" d="M 58 102 C 145 102, 235 188.4, 330 188.4"/>
  <circle class="key" cx="58" cy="102" r="4"/><circle class="key" cx="330" cy="188.4" r="4"/>
  <text x="58" y="224" text-anchor="start">Root 0</text><text x="330" y="224" text-anchor="end">Tip 1</text>

</svg>
