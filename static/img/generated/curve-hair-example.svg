<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" class="kp-curve-diagram" role="img" aria-labelledby="curve-hair-example-title curve-hair-example-desc"><title id="curve-hair-example-title">髪: 先端ほど形に戻る力を弱める</title><desc id="curve-hair-example-desc">髪の根元側のStiffness倍率1、先端0.1。点線と白抜きの毛先は入力ポーズ、実線は変位した形の模式図。根元側は入力ポーズの形に戻る力が大きく、先端側は小さい。RootBone自体は入力ポーズに追従する。</desc><style>.kp-curve-diagram text{font: 13px 'Segoe UI','Noto Sans JP',sans-serif;fill:var(--ifm-font-color-base,#334155)}.kp-curve-diagram .heading{font-size: 14px;font-weight:700}.kp-curve-diagram .axis{fill:none;stroke:var(--ifm-color-emphasis-500,#94a3b8);stroke-width:1.5}.kp-curve-diagram .curve{fill:none;stroke:var(--ifm-color-primary,#2563eb);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.kp-curve-diagram .root{fill:#a855f7;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .tip{fill:#14b8a6;stroke:var(--ifm-background-color,#fff);stroke-width:2}.kp-curve-diagram .body{fill:var(--ifm-color-emphasis-200,#e2e8f0);stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2}.kp-curve-diagram .ghost{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:2;stroke-dasharray:5 5}.kp-curve-diagram .leader{fill:none;stroke:var(--ifm-color-emphasis-600,#64748b);stroke-width:1.5}</style><text x="18" y="28" class="heading">髪 / Stiffness</text><text x="18" y="54">先端ほど、形に戻る力を弱める</text><path class="body" d="M35 236Q45 202 91 202Q121 207 133 236Z"/><ellipse class="body" cx="83" cy="126" rx="38" ry="43"/><path fill="#fbbf24" fill-opacity=".35" stroke="#d97706" stroke-width="2" d="M46 130Q31 80 80 77Q128 75 134 119L113 124Q112 93 86 95Q56 97 46 130Z"/><path class="ghost" d="M112 109Q127 147 122 186Q119 219 120 238"/><path fill="#fbbf24" fill-opacity=".3" stroke="#d97706" stroke-width="3" stroke-linejoin="round" d="M109 103Q130 134 130 163Q136 204 164 230Q142 239 132 224Q111 195 116 163Q120 131 103 111Z"/><circle cx="120" cy="238" r="5" fill="white" stroke="var(--ifm-color-emphasis-600,#64748b)" stroke-width="2"/><circle class="root" cx="112" cy="109" r="6"/><circle class="tip" cx="152" cy="231" r="6"/><path class="leader" d="M121 109H188M160 231H188"/><text x="197" y="103">根元側</text><text x="197" y="127">倍率 ×1.0</text><text x="197" y="151">戻る力 大</text><text x="197" y="220">先端</text><text x="197" y="244">倍率 ×0.1</text><text x="197" y="268">戻る力 小</text><path class="ghost" d="M192 183H217"/><text x="227" y="188">入力ポーズ</text><text x="18" y="276">倍率</text><path class="axis" d="M58 304V394H328"/><path class="axis" opacity=".4" stroke-dasharray="3 5" d="M58 304H328"/><text x="46" y="309" text-anchor="end">1.0</text><text x="46" y="399" text-anchor="end">0</text><path class="curve" d="M58 304L328 385"/><circle class="root" cx="58" cy="304" r="5"/><circle class="tip" cx="328" cy="385" r="5"/><text x="58" y="420">根元 0</text><text x="328" y="420" text-anchor="end">先端 1</text><text x="18" y="458">形と戻る力の模式図</text></svg>
