<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="360" fill="#2a2a2a"/>

  <!-- Title -->
  <text x="360" y="30" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">カスタム重力（Gravity）</text>
  <text x="360" y="50" font-size="11" fill="#888" text-anchor="middle">Gravity ベクトルの向きで揺れ方を制御</text>

  <!-- Normal gravity -->
  <g transform="translate(24, 68)">
    <rect width="156" height="210" fill="#1e1e1e" rx="5" stroke="#2d2d2d"/>
    <text x="78" y="24" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">通常</text>
    <g transform="translate(78, 72)">
      <circle cx="0" cy="0" r="22" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
      <path d="M -14 14 C -18 38, -12 58, -8 76" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M 0 20 C -2 42, 0 63, 2 82" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M 14 14 C 18 38, 15 58, 10 76" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-14" cy="14" r="4" fill="#60a5fa"/>
      <circle cx="0" cy="20" r="4" fill="#60a5fa"/>
      <circle cx="14" cy="14" r="4" fill="#60a5fa"/>
    </g>
    <line x1="126" y1="78" x2="126" y2="132" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="126" y="148" font-size="9" fill="#fb923c" text-anchor="middle">重力</text>
    <text x="78" y="190" font-size="10" fill="#888" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">Gravity = (0, 0, -1)</text>
  </g>

  <!-- Wall walking -->
  <g transform="translate(196, 68)">
    <rect width="156" height="210" fill="#1e1e1e" rx="5" stroke="#2d2d2d"/>
    <text x="78" y="24" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">壁歩き</text>
    <rect x="12" y="42" width="14" height="110" fill="#555" rx="2"/>
    <line x1="26" y1="50" x2="26" y2="150" stroke="#777" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="19" y="166" font-size="9" fill="#888" text-anchor="middle">壁</text>
    <g transform="translate(96, 84)">
      <circle cx="0" cy="0" r="22" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
      <path d="M -18 -4 C -40 -8, -56 0, -68 12" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M -20 8 C -42 15, -55 25, -67 36" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M -10 18 C -30 32, -48 42, -62 52" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-18" cy="-4" r="4" fill="#60a5fa"/>
      <circle cx="-20" cy="8" r="4" fill="#60a5fa"/>
      <circle cx="-10" cy="18" r="4" fill="#60a5fa"/>
    </g>
    <line x1="130" y1="96" x2="82" y2="96" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="106" y="116" font-size="9" fill="#fb923c" text-anchor="middle">重力</text>
    <text x="78" y="190" font-size="10" fill="#888" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">Gravity = -WallNormal</text>
  </g>

  <!-- Zero gravity -->
  <g transform="translate(368, 68)">
    <rect width="156" height="210" fill="#1e1e1e" rx="5" stroke="#2d2d2d"/>
    <text x="78" y="24" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">無重力</text>
    <g transform="translate(78, 90)">
      <circle cx="0" cy="0" r="22" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
      <path d="M -16 8 C -38 -8, -47 -22, -52 -40" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M 0 20 C 1 45, -10 58, -25 68" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M 16 8 C 40 2, 50 20, 56 38" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-16" cy="8" r="4" fill="#60a5fa"/>
      <circle cx="0" cy="20" r="4" fill="#60a5fa"/>
      <circle cx="16" cy="8" r="4" fill="#60a5fa"/>
      <circle cx="-48" cy="-32" r="3" fill="#22d3ee" fill-opacity="0.7"/>
      <circle cx="50" cy="32" r="3" fill="#22d3ee" fill-opacity="0.7"/>
    </g>
    <circle cx="126" cy="88" r="14" fill="#2d2d2d" stroke="#fb923c" stroke-width="2"/>
    <text x="126" y="92" font-size="12" fill="#fb923c" text-anchor="middle" font-weight="bold">0</text>
    <text x="78" y="190" font-size="10" fill="#888" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">Gravity = (0, 0, 0)</text>
  </g>

  <!-- Underwater buoyancy -->
  <g transform="translate(540, 68)">
    <rect width="156" height="210" fill="#1e1e1e" rx="5" stroke="#2d2d2d"/>
    <rect x="8" y="38" width="140" height="128" fill="#0f3a4a" fill-opacity="0.45" rx="4"/>
    <path d="M 14 58 C 34 50, 50 66, 70 58 S 110 50, 142 58" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="78" y="24" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">水中・浮力</text>
    <g transform="translate(78, 110)">
      <circle cx="0" cy="0" r="22" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
      <path d="M -14 -14 C -20 -36, -12 -52, -5 -66" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M 0 -20 C 4 -42, 2 -57, 0 -72" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M 14 -14 C 23 -34, 20 -51, 12 -66" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-14" cy="-14" r="4" fill="#60a5fa"/>
      <circle cx="0" cy="-20" r="4" fill="#60a5fa"/>
      <circle cx="14" cy="-14" r="4" fill="#60a5fa"/>
    </g>
    <line x1="126" y1="132" x2="126" y2="78" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="126" y="148" font-size="9" fill="#fb923c" text-anchor="middle">重力</text>
    <text x="78" y="190" font-size="10" fill="#888" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">Gravity = (0, 0, +0.3)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(254, 305)">
    <path d="M 0 0 C 12 -10, 24 -10, 36 0" fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round"/>
    <text x="48" y="4" font-size="9" fill="#888">髪</text>
    <line x1="96" y1="0" x2="132" y2="0" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="144" y="4" font-size="9" fill="#888">重力ベクトル</text>
  </g>

  <!-- Note -->
  <text x="360" y="345" font-size="10" fill="#888" text-anchor="middle">複数の KawaiiPhysics ノードを使えば部位ごとに異なる重力を設定できます。</text>
</svg>
