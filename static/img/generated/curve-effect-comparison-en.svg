<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 554" class="kp-curve-diagram" role="img" aria-labelledby="curve-effect-comparison-title curve-effect-comparison-desc">
  <title id="curve-effect-comparison-title">Three curve examples</title><desc id="curve-effect-comparison-desc">Hair Stiffness multiplier decreases from 1.0 to 0.1. Tail Damping multiplier is 0.2 throughout. Skirt Radius multiplier increases from 1.0 to 3.0.</desc>
  <style>
    .kp-curve-diagram { --ink: #334155; --grid: #cbd5e1; --curve: #2563eb; }
    @media (prefers-color-scheme: dark) { .kp-curve-diagram { --ink: #e2e8f0; --grid: #64748b; --curve: #60a5fa; } }
    .kp-curve-diagram text { font: 16px 'Segoe UI', Arial, sans-serif; fill: var(--ifm-font-color-base, var(--ink)); }
    .kp-curve-diagram .heading { font-size: 18px; font-weight: 700; }
    .kp-curve-diagram .axis { fill: none; stroke: var(--ifm-color-emphasis-500, var(--grid)); stroke-width: 1.5; }
    .kp-curve-diagram .curve { fill: none; stroke: var(--ifm-color-primary, var(--curve)); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .kp-curve-diagram .key { fill: var(--ifm-color-primary, var(--curve)); }
  </style>
<g transform="translate(0 0)"><text x="18" y="25" class="heading">Hair / Stiffness multiplier: 1.0 → 0.1</text><text x="18" y="43" >Multiplier</text>
  <path class="axis" d="M 58 54 V 155 H 335"/>
  <path class="axis" stroke-dasharray="3 5" opacity="0.45" d="M 58 59 H 330"/>
  <text x="44" y="64" text-anchor="end">1.0</text><text x="44" y="160" text-anchor="end">0</text>
  <path class="curve" d="M 58 59 C 145 59, 235 145.4, 330 145.4"/>
  <circle class="key" cx="58" cy="59" r="4"/><circle class="key" cx="330" cy="145.4" r="4"/>
  <text x="58" y="181" text-anchor="start">Root 0</text><text x="330" y="181" text-anchor="end">Tip 1</text>
</g><g transform="translate(0 180)"><text x="18" y="25" class="heading">Tail / Damping multiplier: 0.2</text><text x="18" y="43" >Multiplier</text>
  <path class="axis" d="M 58 54 V 155 H 335"/>
  <path class="axis" stroke-dasharray="3 5" opacity="0.45" d="M 58 59 H 330"/>
  <text x="44" y="64" text-anchor="end">1.0</text><text x="44" y="160" text-anchor="end">0</text>
  <path class="curve" d="M 58 135.8 C 145 135.8, 235 135.8, 330 135.8"/>
  <circle class="key" cx="58" cy="135.8" r="4"/><circle class="key" cx="330" cy="135.8" r="4"/>
  <text x="58" y="181" text-anchor="start">Root 0</text><text x="330" y="181" text-anchor="end">Tip 1</text>
</g><g transform="translate(0 360)"><text x="18" y="25" class="heading">Skirt / Radius multiplier: 1.0 → 3.0</text><text x="18" y="43" >Multiplier</text>
  <path class="axis" d="M 58 54 V 155 H 335"/>
  <path class="axis" stroke-dasharray="3 5" opacity="0.45" d="M 58 59 H 330"/>
  <text x="44" y="64" text-anchor="end">3.0</text><text x="44" y="160" text-anchor="end">0</text>
  <path class="curve" d="M 58 123 C 145 123, 235 59, 330 59"/>
  <circle class="key" cx="58" cy="123" r="4"/><circle class="key" cx="330" cy="59" r="4"/>
  <text x="58" y="181" text-anchor="start">Root 0</text><text x="330" y="181" text-anchor="end">Tip 1</text>
</g>
</svg>
