name: Check Documentation

on:
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-updated]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Record the source revision for inspection; documentation sync is not implemented.
      - name: Record KawaiiPhysics source revision
        run: |
          git clone --depth 1 https://github.com/pafuhana1213/KawaiiPhysics.git /tmp/KawaiiPhysics
          git -C /tmp/KawaiiPhysics rev-parse HEAD

      - name: Check documentation types
        run: npm run typecheck

      # Docusaurus checks internal links while building both locales.
      - name: Build documentation and check internal links
        run: npm run build
